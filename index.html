<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#35594f">
  <meta name="application-name" content="诗海">
  <meta name="app-version" content="v1.2.2">
  <meta name="description" content="诗海 Shihai — 唐诗宋词、毛主席诗词离线分类查询阅读，内置 2780+ 首，无需联网。">
  <title>诗海 Shihai · 唐诗宋词·毛主席诗词</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css?v=122">
</head>
<body>

  <!-- ============ 首页：每日一诗 + 分类入口 + 搜索 ============ -->
  <section id="sc-view-home" class="sc-view sc-active">
    <header class="sc-hd">
      <div class="sc-brand">诗海<span class="sc-brand-en">Shihai</span></div>
      <div class="sc-brand-sub" id="sc-home-date">--</div>
    </header>
    <main class="sc-body">
      <div class="sc-card sc-daily" id="sc-daily-card">
        <div class="sc-daily-hd">
          <span class="sc-daily-tag">今日在读</span>
          <button type="button" id="sc-daily-switch" class="sc-daily-switch">换一首 ⟳</button>
        </div>
        <h2 class="sc-daily-title" id="sc-daily-title">--</h2>
        <p class="sc-daily-author" id="sc-daily-author">--</p>
        <p class="sc-daily-lines" id="sc-daily-lines">--</p>
        <button type="button" id="sc-daily-more" class="sc-btn-ghost sc-daily-more">读全文 →</button>
      </div>

      <div class="sc-search-wrap">
        <input type="search" id="sc-search-input" class="sc-search" placeholder="搜索标题 / 作者 / 诗句…" autocomplete="off">
        <button type="button" id="sc-search-btn" class="sc-search-btn">搜</button>
      </div>

      <div class="sc-cat-grid">
        <button class="sc-cat-card sc-cat-tang" data-list="tang"><b>唐诗</b><span id="sc-cat-tang-n">0 首</span></button>
        <button class="sc-cat-card sc-cat-song" data-list="song"><b>宋词</b><span id="sc-cat-song-n">0 首</span></button>
        <button class="sc-cat-card sc-cat-mao" data-list="mao"><b>毛主席诗词</b><span id="sc-cat-mao-n">0 首</span></button>
        <button class="sc-cat-card sc-cat-author" data-nav="sc-view-authors"><b>按作者</b><span id="sc-cat-author-n">0 人</span></button>
        <button class="sc-cat-card sc-cat-cipai" data-nav="sc-view-cipai"><b>按词牌</b><span id="sc-cat-cipai-n">0 个</span></button>
        <button class="sc-cat-card sc-cat-fav" data-list="fav"><b>我的收藏</b><span id="sc-cat-fav-n">0 首</span></button>
        <button class="sc-cat-card sc-cat-rand" id="sc-btn-random"><b>随机一首</b><span>开盲盒</span></button>
      </div>

      <div class="sc-card sc-stats">
        <h3 class="sc-card-title">离线书库</h3>
        <p class="sc-stats-line" id="sc-stats-line">加载中…</p>
        <p class="sc-tip">全部诗词已随应用缓存，断网也能查询阅读；毛主席诗词附创作背景。</p>
      </div>
      <p id="sc-version-line" class="sc-version-line">诗海 Shihai</p>
    </main>
  </section>

  <!-- ============ 诗词列表（唐诗/宋词/作者作品/词牌作品/收藏/搜索结果 共用） ============ -->
  <section id="sc-view-list" class="sc-view">
    <header class="sc-hd sc-hd-compact">
      <div class="sc-hd-row">
        <button type="button" id="sc-list-back" class="sc-btn-round">‹</button>
        <div class="sc-list-hd-mid">
          <h1 id="sc-list-title">诗词</h1>
          <span id="sc-list-count" class="sc-list-count">0 首</span>
        </div>
      </div>
      <div class="sc-filter-row" id="sc-filter-row"></div>
    </header>
    <main class="sc-body">
      <ul id="sc-poem-list" class="sc-poem-list"></ul>
      <div id="sc-list-empty" class="sc-empty sc-hidden"><p>没有匹配的诗词</p></div>
      <button type="button" id="sc-load-more" class="sc-btn-ghost sc-load-more sc-hidden">加载更多</button>
    </main>
  </section>

  <!-- ============ 阅读页 ============ -->
  <section id="sc-view-read" class="sc-view">
    <header class="sc-hd sc-hd-compact">
      <div class="sc-hd-row">
        <button type="button" id="sc-read-back" class="sc-btn-round">‹</button>
        <div class="sc-list-hd-mid"><h1 id="sc-read-crumb">阅读</h1></div>
        <button type="button" id="sc-read-fav" class="sc-btn-fav">☆</button>
      </div>
    </header>
    <main class="sc-body">
      <article class="sc-read">
        <h2 class="sc-read-title" id="sc-read-title">--</h2>
        <p class="sc-read-meta" id="sc-read-meta">--</p>
        <div class="sc-read-lines" id="sc-read-lines"></div>
        <div class="sc-read-bg sc-hidden" id="sc-read-bg"></div>
        <div class="sc-read-foot">
          <button type="button" id="sc-read-copy" class="sc-btn-mini">复制全文</button>
          <span class="sc-read-idx" id="sc-read-idx"></span>
        </div>
        <div class="sc-read-pager">
          <button type="button" id="sc-read-prev" class="sc-btn-ghost">‹ 上一首</button>
          <button type="button" id="sc-read-next" class="sc-btn-ghost">下一首 ›</button>
        </div>
      </article>
    </main>
  </section>

  <!-- ============ 作者库 ============ -->
  <section id="sc-view-authors" class="sc-view">
    <header class="sc-hd sc-hd-compact">
      <div class="sc-hd-row">
        <button type="button" id="sc-authors-back" class="sc-btn-round">‹</button>
        <div class="sc-list-hd-mid"><h1>诗人</h1><span class="sc-list-count" id="sc-authors-count"></span></div>
      </div>
    </header>
    <main class="sc-body">
      <div id="sc-authors-wrap"></div>
    </main>
  </section>

  <!-- ============ 词牌库 ============ -->
  <section id="sc-view-cipai" class="sc-view">
    <header class="sc-hd sc-hd-compact">
      <div class="sc-hd-row">
        <button type="button" id="sc-cipai-back" class="sc-btn-round">‹</button>
        <div class="sc-list-hd-mid"><h1>词牌</h1><span class="sc-list-count" id="sc-cipai-count"></span></div>
      </div>
    </header>
    <main class="sc-body">
      <div class="sc-chip-cloud" id="sc-cipai-wrap"></div>
    </main>
  </section>

  <!-- ============ 底部导航 ============ -->
  <nav class="sc-tabbar">
    <button data-view="sc-view-home" class="sc-on"><span class="sc-tab-ico">✦</span><span>首页</span></button>
    <button data-view-list="tang"><span class="sc-tab-ico">唐</span><span>唐诗</span></button>
    <button data-view-list="song"><span class="sc-tab-ico">宋</span><span>宋词</span></button>
    <button data-view-list="mao"><span class="sc-tab-ico">毛</span><span>毛诗词</span></button>
    <button data-view-list="fav"><span class="sc-tab-ico">♥</span><span>收藏</span></button>
  </nav>

  <div id="sc-toast" class="sc-toast sc-hidden"></div>

  <script src="data-tang.js?v=122"></script>
  <script src="data-song.js?v=122"></script>
  <script src="data-mao.js?v=122"></script>
  <script src="data-extra.js?v=122"></script>
  <script src="app.js?v=122"></script>
</body>
</html>
